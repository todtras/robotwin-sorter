#   Roboflow가 내려준 순서를 그대로 쓰고 임의로 바꾸지 마세요.
#
# Colab에서 학습할 때는 path를 /content/dataset 으로 바꿔야 합니다.

path: ../dataset
train: images/train
val: images/val
test: images/test

nc: 3
names:
  0: can
  1: general
  2: pet
