# dataset/data.yaml — YOLO 학습 설정
#
# ★★★ names의 순서는 common/schema.py의 CLASS_NAMES와 반드시 일치 ★★★
#   어긋나면 페트병을 캔으로 분류하는 버그가 나는데, 모델도 코드도 정상이라
#   원인 찾는 데 반나절이 날아갑니다. 학습 직전에 두 파일을 나란히 대조하세요.
#
# ★ Roboflow는 클래스를 알파벳 순으로 강제 정렬해서 내보냅니다 (can/general/pet).
